name: Daily data refresh

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 北京时间 10:00
  workflow_dispatch:
    inputs:
      use_fallback:
        description: '强制使用备用数据源 (radio-browser.info)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- 主数据源：roamdial.com（原站快照） ----
      - name: 主源下载 (roamdial.com)
        id: main
        continue-on-error: true
        if: ${{ !inputs.use_fallback }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36 RoamDialMirror/1.0"
          curl -fsSL --retry 3 --connect-timeout 20 -A "$UA" -o /tmp/api_core_cn.json "https://roamdial.com/api/globe?part=core&r=cn"
          curl -fsSL --retry 3 --connect-timeout 20 -A "$UA" -o /tmp/api_rest.json "https://roamdial.com/api/globe?part=rest&r=cn"
          curl -fsSL --retry 3 --connect-timeout 20 -A "$UA" -o /tmp/land-dots.json "https://roamdial.com/land-dots.json"
          # 基本校验：非空、JSON 开头正确（api_* 为对象 {，land-dots 为数组 [），防止抓到错误页面
          for f in /tmp/api_core_cn.json /tmp/api_rest.json; do
            [ -s "$f" ] || { echo "文件为空: $f"; exit 1; }
            head -c 1 "$f" | grep -q '{' || { echo "不是 JSON 对象: $f"; exit 1; }
          done
          [ -s /tmp/land-dots.json ] || { echo "文件为空: /tmp/land-dots.json"; exit 1; }
          head -c 1 /tmp/land-dots.json | grep -q '\[' || { echo "不是 JSON 数组: /tmp/land-dots.json"; exit 1; }
          echo "主源下载成功"

      # ---- 备用数据源：radio-browser.info（主源失败或手动强制时） ----
      - name: 备用源下载 (radio-browser.info)
        id: fallback
        if: ${{ steps.main.outcome == 'failure' || inputs.use_fallback }}
        run: |
          echo "使用备用数据源 radio-browser.info ..."
          # 先跑离线自检（几秒钟），规则或词表坏了就直接失败，不让它产出半吊子快照
          python3 -m unittest discover -s .github/scripts -p "test_*.py"
          python3 .github/scripts/fetch_radio_browser.py /tmp
          echo "备用源生成成功（land-dots.json 保持仓库现有版本）"

      # ---- 校验最终结果 ----
      - name: 校验数据文件
        run: |
          set -euo pipefail
          for f in api_core_cn.json api_rest.json; do
            [ -s "/tmp/$f" ] || { echo "缺少 $f"; exit 1; }
            head -c 1 "/tmp/$f" | grep -q '{' || { echo "格式错误: $f"; exit 1; }
          done
          if [ -f /tmp/land-dots.json ]; then
            head -c 1 /tmp/land-dots.json | grep -q '\[' || { echo "格式错误: land-dots.json"; exit 1; }
          fi
          echo "数据校验通过"

      # 前端把两份分片当同一批数据：core.builtAt/rg 与 rest 不一致就判定「数据正在更新」，
      # 强制刷新一次仍不一致会直接报错卡片，所以自相矛盾的快照绝对不能提交。
      - name: 校验分片一致性
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const core = JSON.parse(fs.readFileSync("/tmp/api_core_cn.json", "utf8"));
            const rest = JSON.parse(fs.readFileSync("/tmp/api_rest.json", "utf8"));
            if (core.builtAt !== rest.builtAt) {
              console.error(`builtAt 不一致: core=${core.builtAt} rest=${rest.builtAt}`);
              process.exit(1);
            }
            if (core.rg !== rest.rg) {
              console.error(`rg 不一致: core=${JSON.stringify(core.rg)} rest=${JSON.stringify(rest.rg)}`);
              process.exit(1);
            }
            if (!Array.isArray(rest.id) || rest.id.length !== core.n) {
              console.error(`行数不一致: core.n=${core.n} rest.id=${Array.isArray(rest.id) ? rest.id.length : typeof rest.id}`);
              process.exit(1);
            }
            console.log(`分片一致性通过: builtAt=${core.builtAt} rg=${core.rg} 行数=${core.n}`);
          '

      - name: 检测是否有更新
        id: check
        run: |
          changed=0
          for f in api_core_cn.json api_rest.json land-dots.json; do
            [ -f "/tmp/$f" ] || continue   # 备用源不更新 land-dots
            if [ -f "$f" ] && cmp -s "/tmp/$f" "$f"; then
              echo "无变化: $f"
            else
              echo "有变化: $f"
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: 备份旧数据（按日期保存）
        if: steps.check.outputs.changed == '1'
        run: |
          set -euo pipefail
          TODAY=$(date +%F)
          mkdir -p "backups/$TODAY"
          for f in api_core_cn.json api_rest.json land-dots.json; do
            if [ -f "$f" ]; then cp "$f" "backups/$TODAY/"; fi
          done
          echo "旧数据已备份到 backups/$TODAY/"

      - name: 写入新数据
        if: steps.check.outputs.changed == '1'
        run: |
          for f in api_core_cn.json api_rest.json land-dots.json; do
            if [ -f "/tmp/$f" ]; then cp "/tmp/$f" "$f"; fi
          done
          true

      - name: 清理超过 360 个的备份
        if: steps.check.outputs.changed == '1'
        run: |
          set -euo pipefail
          cd backups
          TOTAL=$(ls -1d 20[0-9][0-9]-[0-9][0-9]-*/ 2>/dev/null | wc -l)
          if [ "$TOTAL" -gt 360 ]; then
            ls -1d 20[0-9][0-9]-[0-9][0-9]-*/ | sort | head -n $((TOTAL - 360)) | xargs rm -rf
            echo "已清理 $((TOTAL - 360)) 个过期备份，当前保留 360 个"
          else
            echo "备份数 $TOTAL，无需清理"
          fi

      - name: 提交并推送
        if: steps.check.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): 每日数据更新 $(date +%F)" || { echo "无变更可提交"; exit 0; }
          git push
          echo "已提交并推送最新数据"
